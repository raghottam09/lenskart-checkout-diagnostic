      <div class="card">
        <h3 style="margin-top:0;">P5: Regional Net Revenue Shift (Feb → Mar 2026)</h3>

function simulateNewOrder() {
  const id = 'ORD-' + (10001 + TX.length);
  TX.push([id, "Mar", "East", "Kolkata", "LK-KOL-06", "Store Walk-in", "PRD-108", "Eyeglasses", "Progressive", 1, 5299, 530, 4769, 2100, 50, 0, 0, 2619]);
  showTab(currentTab);
  runAutonomousAgent("LIVE EVENT TRIGGERED: New Progressive Eyeglass order (" + id + ") ingested in East!");
}

function runAutonomousAgent(customMsg) {
  agentRuns++;
  const now = new Date().toLocaleTimeString();
  const eastMar = TX.filter(r => r[2]==='East' && r[1]==='Mar').reduce((a, r) => a + r[12], 0);
  const eastFeb = TX.filter(r => r[2]==='East' && r[1]==='Feb').reduce((a, r) => a + r[12], 0);
  const pct = (((eastMar - eastFeb) / eastFeb) * 100).toFixed(1);
  const msg = customMsg || `[AUTO-AGENT #${agentRuns}] Scanned ${TX.length} live rows. East Mar Net Rev = ${fmt(eastMar)} (${pct}% vs Feb). Primary anomaly: East Progressive/Blue-Cut mix collapse; Chennai return rate at 19.2%.`;
  logs.unshift(`[${now}] ${msg}`);
  logs = logs.slice(0, 5);
  document.getElementById('agentTimer').innerText = `Last Auto-Scan: ${now} | Runs: ${agentRuns}`;
  document.getElementById('agentLogs').innerHTML = logs.map(l => `<div class="log-line">${l}</div>`).join('');
}
